name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --manifest-path 01-learning-engine/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path 01-learning-engine/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path 01-learning-engine/Cargo.toml --release

      # The movegen gate. Depth 4 on all six canonical positions is the CI
      # compromise: it runs in under a second and catches every rule bug that
      # depth 6 would, only slower.
      - name: Perft (six canonical positions, depth 4)
        run: |
          cd 01-learning-engine
          cargo run --release -- perft 4 "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          cargo run --release -- perft 4 "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
          cargo run --release -- perft 4 "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1"
          cargo run --release -- perft 4 "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1"
          cargo run --release -- perft 4 "rnbq1k1r/pp1Pbppp/2p5/8/2B5/8/PPP1NnPP/RNBQK2R w KQ - 1 8"
          cargo run --release -- perft 4 "r4rk1/1pp1qppp/p1np1n2/2b1p1B1/2B1P1b1/P1NP1N2/1PP1QPPP/R4RK1 w - - 0 10"

      - name: Perft depth 5 (startpos and kiwipete)
        run: |
          cd 01-learning-engine
          cargo run --release -- perft 5 "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          cargo run --release -- perft 5 "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"

      - name: Upload Linux engine
        uses: actions/upload-artifact@v4
        with:
          name: aurora-engine-linux
          path: 01-learning-engine/target/release/aurora-engine

  rust-windows:
    name: Rust engine (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --manifest-path 01-learning-engine/Cargo.toml --release
      - name: Build release
        run: cargo build --manifest-path 01-learning-engine/Cargo.toml --release
      - name: Upload Windows engine
        uses: actions/upload-artifact@v4
        with:
          name: aurora-engine-windows
          path: 01-learning-engine/target/release/aurora-engine.exe

  javascript:
    name: GUI rules and engine (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The browser rules layer is held to the same perft standard as the Rust
      # engine. A GUI that allows an illegal move is worse than no GUI.
      - name: Perft the JavaScript move generator
        run: node 02-fast-app/web/perft-test.mjs

      - name: Sanity check the JavaScript search
        run: node 02-fast-app/web/smoke-test.mjs

      # The coach grades every move the user plays. Wrong arithmetic here means
      # the app confidently calls good moves blunders, which is worse than
      # having no coach at all.
      - name: Coach grading logic
        run: node 02-fast-app/web/coach-test.mjs

      # Arrows are drawn on an SVG layer over the board. If the square->pixel
      # mapping disagrees with renderBoard(), they point at the wrong squares.
      - name: Coach arrow geometry
        run: node 02-fast-app/web/arrow-test.mjs

      # Drives the real page in a DOM: plays a move, waits for the coach, and
      # checks the badge and the arrow. This is the only suite that can catch the
      # app stalling after the first move, which is what a synchronous search at
      # too deep a setting does to the main thread.
      - name: Coach in the real page
        run: node 02-fast-app/web/gui-test.mjs

  selfplay:
    name: Self-play (no illegal moves)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # selfplay.py uses python-chess purely as an independent referee: it
      # checks that every move the engine emits is legal in the position it was
      # actually given. It is never used to decide anything.
      - name: Install python-chess
        run: pip install chess

      - name: Build engine
        run: cargo build --manifest-path 01-learning-engine/Cargo.toml --release

      - name: Play 20 plies and verify every move is legal
        run: python tools/selfplay.py 20 4

  desktop:
    name: Windows desktop app (Tauri)
    runs-on: windows-latest
    needs: [rust-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the Tauri dependency tree. It is ~400 crates, so a cold build is
      # the dominant cost of this job and it is worth caching aggressively.
      - name: Cache Tauri cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            02-fast-app/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('02-fast-app/src-tauri/Cargo.lock') }}

      - name: Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 02-fast-app/package-lock.json

      - name: Install Tauri CLI
        working-directory: 02-fast-app
        run: npm install --no-audit --no-fund

      # The desktop app runs the engine as a child process, so the engine has to
      # exist before bundling. Build it first and stage it where the shell
      # looks for it.
      - name: Build engine
        run: cargo build --manifest-path 01-learning-engine/Cargo.toml --release

      - name: Stage engine next to the app
        shell: pwsh
        run: |
          $stage = "02-fast-app\src-tauri\engine"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "01-learning-engine\target\release\aurora-engine.exe" $stage\

      - name: Verify the Tauri config parses before spending 10 minutes on it
        shell: pwsh
        working-directory: 02-fast-app
        run: |
          $conf = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          Write-Output "productName : $($conf.productName)"
          Write-Output "identifier : $($conf.identifier)"
          Write-Output "targets    : $($conf.bundle.targets -join ', ')"

      - name: Build the installer
        working-directory: 02-fast-app
        run: npm run tauri build -- --bundles nsis

      - name: Collect the installers
        shell: pwsh
        run: |
          Get-ChildItem "02-fast-app\src-tauri\target\release\bundle" -Recurse -Include *.exe,*.msi |
            ForEach-Object { Write-Output "$($_.Length) $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-chess-desktop-windows
          path: |
            02-fast-app/src-tauri/target/release/bundle/**/*.exe
            02-fast-app/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 30

  build-output:
    name: Release bundle
    runs-on: windows-latest
    needs: [rust, rust-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build
        run: cargo build --manifest-path 01-learning-engine/Cargo.toml --release

      - name: Package
        shell: pwsh
        run: |
          # Create every destination first. Copy-Item fails the whole step if the
          # target directory does not exist, which is a silent-looking way to
          # lose a release.
          New-Item -ItemType Directory -Force -Path release\engine  | Out-Null
          New-Item -ItemType Directory -Force -Path release\web    | Out-Null

          Copy-Item 01-learning-engine\target\release\aurora-engine.exe release\engine\
          Copy-Item 02-fast-app\web\index.html release\web\
          Copy-Item 02-fast-app\web\chess.js  release\web\
          Copy-Item 02-fast-app\web\engine.js release\web\
          Copy-Item 02-fast-app\server.js release\
          Copy-Item 02-fast-app\README.md  release\
          Copy-Item artifacts\aurora-engine-linux\aurora-engine release\engine\aurora-engine-linux
          Copy-Item README.md release\

          Write-Output "packaged:"
          Get-ChildItem release -Recurse -File |
            ForEach-Object { Write-Output ("  {0,8:N0}  {1}" -f $_.Length, $_.FullName.Replace((Get-Location).Path, '.')) }

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-chess-release
          path: release\