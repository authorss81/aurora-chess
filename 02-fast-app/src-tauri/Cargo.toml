[package]
name = "aurora-chess-desktop"
version = "0.1.0"
description = "Aurora Chess - a chess application with an engine written from scratch"
authors = ["Aurora Chess Project"]
edition = "2021"
rust-version = "1.77"

# This crate is only the desktop shell. The chess logic lives in
# ../../01-learning-engine and is spawned as a child process, exactly as the
# book describes in Chapter 11.
[lib]
name = "aurora_chess_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used by `tauri dev`
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true