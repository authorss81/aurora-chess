<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Chess</title>
<style>
  :root{
    --bg:#14120f; --panel:#1e1b17; --panel2:#272319; --line:#3a332a;
    --text:#ece5d8; --muted:#a2988a; --accent:#d4a24c; --good:#7fb069;
    --light:#f0d9b5; --dark:#b58863; --hl:#f5e6a8; --check:#e06c5a;
  }
  *{box-sizing:border-box}
  /* Everything has to fit without scrolling. The app is a fixed-height grid:
     the coach strip across the top, the board under it on the left, and a
     scrolling column of controls on the right. Having to scroll to reach the
     coach after playing a move defeats the point of the coach. */
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Iowan Old Style",Georgia,serif;
    padding:10px; overflow:hidden;
  }
  .app{
    display:grid; grid-template-columns:auto 322px; grid-template-rows:auto minmax(0,1fr);
    gap:12px; max-width:1280px; width:100%; height:100vh; margin:0 auto;
  }
  /* The coach remark goes on top, full width, where it is read first. */
  .coachtop{
    grid-column:1 / -1;
    display:flex; align-items:flex-start; gap:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; min-height:74px; max-height:30vh; overflow-y:auto;
  }
  .coachtop .ct-left{display:flex; align-items:center; gap:12px; flex:0 0 auto}
  .coachtop .ct-badge{
    font-size:15px; padding:6px 14px; border-radius:14px; min-width:104px;
    text-align:center; font-weight:700; letter-spacing:.3px;
  }
  .coachtop .ct-meta{line-height:1.35}
  .coachtop .ct-swing{font-family:Consolas,monospace; font-size:14px; color:var(--muted)}
  .coachtop .ct-acc{font-size:12px; color:var(--muted)}
  .coachtop .ct-body{flex:1 1 auto; font-size:14px; line-height:1.5; color:#d9d0c2}
  .coachtop .ct-body b{color:var(--accent)}
  .coachtop .ct-teach{margin-top:4px; color:#b9ae9c; font-size:13px}
  .boardwrap{align-self:center}

  /* ---------- board ---------- */
  .boardwrap{display:flex; gap:12px; position:relative}
  /* Arrows live in an SVG layer over the board. pointer-events:none so they
     never swallow a click. */
  #arrows{position:absolute; inset:0; pointer-events:none; z-index:5; overflow:visible}
  .coachpanel{
    margin-top:10px; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:#14120f; font-size:13.5px; line-height:1.55;
  }
  .coachbadge{
    display:inline-block; font-weight:700; padding:2px 10px; border-radius:12px;
    margin-right:8px; font-size:13px; letter-spacing:.3px;
  }
  .b-best{background:#3d7a3a;color:#eaf5e8}
  .b-good{background:#4a6b8a;color:#e8f0f7}
  .b-ok{background:#5a5340;color:#f0ead8}
  .b-inacc{background:#8a6b2a;color:#fdf3d8}
  .b-mist{background:#9a5a2a;color:#fde8d8}
  .b-blun{background:#8f3a34;color:#fde3e1}
  .coachdelta{font-family:Consolas,monospace; font-size:12.5px; color:var(--muted)}
  .coachteach{color:#cfc6b8; margin-top:6px}
  .coachteach b{color:var(--accent)}
  .evalbar{
    width:20px; border-radius:10px; overflow:hidden; position:relative;
    background:#4a4034; border:1px solid var(--line);
  }
  .evalbar .white{position:absolute; bottom:0; left:0; right:0; background:#f4efe4; transition:height .25s}
  .evalbar .label{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%) rotate(-90deg);
    transform-origin:center; font-size:11px; color:#333; white-space:nowrap; font-family:monospace;
  }
  .board{
    /* 54vh keeps the board, the coach strip and the side panel above the fold,
       so nothing important ever needs a scroll to reach. */
    width:min(54vh, 520px); height:min(54vh, 520px);
    display:grid;
    /* minmax(0,1fr), not 1fr: a plain 1fr track has min-width:auto, so a piece
       glyph or the capture ring can widen the track and break the 1:1 aspect
       ratio. Selecting a piece is what makes that happen, which is why the
       squares only grew after a move. */
    grid-template-columns:repeat(8, minmax(0, 1fr));
    grid-template-rows:repeat(8, minmax(0, 1fr));
    width:min(74vw, 520px);
    height:min(74vw, 520px);   /* explicit, so nothing can stretch it */
    border:2px solid var(--line); border-radius:6px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5); user-select:none;
  }
  .sq{
    position:relative; display:flex; align-items:center; justify-content:center;
    cursor:pointer; min-width:0; min-height:0; overflow:hidden;
  }
  .sq.light{background:var(--light)} .sq.dark{background:var(--dark)}
  .sq.last::after{content:''; position:absolute; inset:0; background:var(--hl); opacity:.42}
  .sq.sel::after{content:''; position:absolute; inset:0; background:#8fd18a; opacity:.5}
  .sq.check{background:var(--check)!important}
  .sq .dot{
    position:absolute; width:26%; height:26%; border-radius:50%;
    background:rgba(30,60,30,.42); pointer-events:none;
  }
  .sq .cap{
    position:absolute; inset:0; border:6px solid rgba(60,30,30,.45);
    border-radius:50%; pointer-events:none; box-sizing:border-box;
  }
  .sq .pc{
    /* Absolute, so the glyph contributes nothing to layout - that is the second
       half of the fix. Sized conservatively rather than filling the square:
       note that a percentage font-size here would resolve against the containing
       block, not the square, so it must stay absolute-length based. */
    font-size:min(7.4vw, 48px); line-height:1;
    position:absolute; z-index:2; pointer-events:none; user-select:none;
    font-family:"Segoe UI Symbol","DejaVu Sans",serif;
  }
  .sq .pc.w{color:#fff; text-shadow:0 1px 2px #000, 0 0 1px #000}
  .sq .pc.b{color:#111; text-shadow:0 1px 1px rgba(255,255,255,.35)}
  .coord{position:absolute; font-size:10px; font-family:monospace; opacity:.55}
  .coord.r{bottom:1px; right:3px} .coord.f{bottom:0; left:3px}
  .sq.light .coord{color:#4a3a20} .sq.dark .coord{color:#e8dcc4}

  /* ---------- side panels ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px;
  }
  .side{
    width:322px; display:flex; flex-direction:column; gap:10px;
    min-height:0; overflow-y:auto; padding-right:2px;
  }
  .panel.compact{padding:10px 12px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; align-items:center}
  .grid2 label{margin:0}
  .moves{max-height:24vh; overflow-y:auto}
  .panel.grow{display:flex; flex-direction:column; gap:8px; min-height:0}

  .clocks{display:flex; flex-direction:column; gap:8px}
  .clock{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 13px;
  }
  .clock.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
  /* The increment makes a clock go UP by design. That is correct chess, but
     with nothing on screen it reads as a broken clock, so bank it visibly. */
  .clock{position:relative}
  .clock .inc{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:Consolas,monospace; font-size:15px; font-weight:700;
    color:#7fd67f; text-shadow:0 1px 3px #000; pointer-events:none;
    opacity:0; transition:opacity .35s ease;
  }
  .clock .inc.show{opacity:1}
  .clock .who{font-size:13px; color:var(--muted)}
  .clock .tm{font-family:Consolas,monospace; font-size:26px; font-variant-numeric:tabular-nums}
  .clock.low .tm{color:#e06c5a}

  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:8px 13px; cursor:pointer; font-family:inherit; font-size:14px;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:var(--accent); color:#1a1512; border-color:var(--accent); font-weight:600}
  select,input[type=number],input[type=text]{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px; font-family:inherit; font-size:14px;
  }
  label{font-size:13px; color:var(--muted)}

  .moves{
    flex:1; min-height:150px; max-height:320px; overflow-y:auto;
    font-family:Consolas,monospace; font-size:14px; line-height:1.7;
    background:#14120f; border:1px solid var(--line); border-radius:8px; padding:9px;
  }
  .moves .num{color:var(--muted); display:inline-block; width:34px}
  .moves .san{cursor:pointer; padding:1px 4px; border-radius:4px}
  .moves .san:hover{background:var(--panel2)}
  .moves .san.last{background:var(--accent); color:#1a1512}

  .status{font-size:13.5px; color:var(--muted); min-height:20px}
  .status b{color:var(--accent)}
  .pv{font-family:Consolas,monospace; font-size:12.5px; color:var(--muted);
      background:#14120f; border:1px solid var(--line); border-radius:8px; padding:8px; min-height:34px}

  dialog{
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:12px; padding:22px; max-width:520px; width:92%;
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .promo-opts{display:flex; gap:10px; margin-top:14px}
  .promo-opts button{flex:1; font-size:28px; padding:10px}
  .fenrow{display:flex; gap:8px; margin-top:10px}
  .fenrow input{flex:1; font-family:Consolas,monospace; font-size:12px}
  .log{
    font-family:Consolas,monospace; font-size:11.5px; color:var(--muted);
    max-height:130px; overflow-y:auto; background:#14120f;
    border:1px solid var(--line); border-radius:8px; padding:8px;
  }
  .badge{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:11px;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted);
  }
  .badge.on{background:var(--good); color:#12100e; border-color:var(--good)}
</style>
</head>
<body>
<div class="app">

  <div class="coachtop" id="coachTop">
    <div class="ct-left">
      <div class="ct-badge b-ok" id="coachBadgeTop">no move yet</div>
      <div class="ct-meta">
        <div class="ct-swing" id="coachSwing">&nbsp;</div>
        <div class="ct-acc" id="coachAccuracy">accuracy &mdash;</div>
      </div>
    </div>
    <div class="ct-body" id="coachBody">Play a move and it will be graded here. The better move and your opponent&rsquo;s best reply are drawn on the board.</div>
  </div>

  <div class="boardwrap">
    <div class="evalbar" title="evaluation, White at the top">
      <div class="white" id="evalFill" style="height:50%"></div>
      <div class="label" id="evalLabel">0.0</div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <div class="side">
    <div class="panel">
      <div class="clocks">
        <div class="clock" id="cw">
          <span class="who" id="cwn">White</span><span class="tm" id="cwt">--:--</span>
        </div>
        <div class="clock" id="cb">
          <span class="who" id="cbn">Black</span><span class="tm" id="cbt">--:--</span>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="newBtn">New game</button>
        <button id="flipBtn">Flip</button>
        <button id="undoBtn">Take back</button>
        <button id="resignBtn">Resign</button>
      </div>
    </div>

    <div class="panel compact">
      <div class="grid2">
        <label for="tcSel">Time</label>
        <select id="tcSel">
          <option value="180+2">3+2</option>
          <option value="300+3" selected>5+3</option>
          <option value="600+5">10+5</option>
          <option value="60+0">1+0</option>
          <option value="1800+10">30+10</option>
        </select>
      </div>
        <label for="modeSel">Opponent</label>
        <select id="modeSel">
          <option value="engine" selected>Play vs engine</option>
          <option value="human">Two players</option>
        </select>
        <select id="sideSel">
          <option value="white" selected>as White</option>
          <option value="black">as Black</option>
        </select>
      </div>
        <label for="levelSel">Level</label>
        <select id="levelSel">
          <option value="1">Beginner</option>
          <option value="5">Casual</option>
          <option value="10" selected>Club</option>
          <option value="16">Strong</option>
          <option value="20">Full strength</option>
        </select>
      </div>
        <label for="srcSel">Engine</label>
        <select id="srcSel">
          <option value="auto" selected>Auto (Rust if available)</option>
          <option value="js">Built-in JavaScript</option>
          <option value="rust">Rust (aurora-engine.exe)</option>
        </select>
      </div>
        <label>Mode</label>
        <span style="display:flex; gap:6px; flex-wrap:wrap">
          <span class="badge" id="srcBadge">checking engine...</span>
          <span class="badge" id="srcLabel">detecting transport</span>
        </span>
      </div>
      <div class="grid2" style="margin-top:9px">
        <label for="coachDepth">Coach</label>
        <select id="coachDepth" title="how long the coach thinks">
          <option value="250">quick (0.25s)</option>
          <option value="600" selected>normal (0.6s)</option>
          <option value="1200">thorough (1.2s)</option>
        </select>
      </div>
    </div>

    <div class="panel grow">
      <div class="status" id="status">Ready. Make a move.</div>
      <div class="row" style="margin:0">
        <label><input type="checkbox" id="coachOn" checked> Coach mode</label>
      </div>
      <div class="moves" id="moves"></div>
      <div class="pv" id="pv">&nbsp;</div>
      <div class="row">
        <button id="pgnBtn">Export PGN</button>
        <button id="copyBtn">Copy FEN</button>
        <button id="fenBtn">Load FEN</button>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <button id="logToggle">Engine log</button>
      </div>
      <div class="log" id="log" style="display:none; margin-top:8px"></div>
    </div>
  </div>
</div>

<dialog id="promoDlg">
  <div style="font-size:17px">Pawn promotes. Choose a piece:</div>
  <div class="promo-opts">
    <button data-p="5">Queen</button>
    <button data-p="4">Rook</button>
    <button data-p="3">Bishop</button>
    <button data-p="2">Knight</button>
  </div>
</dialog>

<dialog id="fenDlg">
  <div style="font-size:17px; margin-bottom:10px">Load a position (FEN)</div>
  <div class="fenrow"><input type="text" id="fenInput" spellcheck="false"></div>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="fenLoad">Load</button>
    <button id="fenCancel">Cancel</button>
  </div>
</dialog>

<script type="module">
import {
  Position, START_FEN, generateLegal, legalMovesFrom, applyMove,
  toSan, gameStatus, sqName, sqFromName, makeSq, fileOf, rankOf, EMPTY,
  inCheck, isInsufficientMaterial,
} from './chess.js';
import { think, evaluate } from './engine.js';
import {
  winPercent, moveAccuracy, COACH_BANDS, gradeMove, bandColor, coachAdvice,
} from './coach.js';

const $ = (id) => document.getElementById(id);
const GLYPH = {
  1:'\u2659', 2:'\u2658', 3:'\u2657', 4:'\u2656', 5:'\u2655', 6:'\u2654',
  '-1':'\u265F', '-2':'\u265E', '-3':'\u265D', '-4':'\u265C', '-5':'\u265B', '-6':'\u265A',
};

// ---------------------------------------------------------------- state
const state = {
  pos: new Position(START_FEN),
  history: [],              // [{san, from, to, fenBefore}]
  selected: null,
  legal: [],
  flipped: false,
  thinking: false,
  over: false,
  clocks: { w: 0, b: 0, inc: 0, base: 0 },
  lastMove: null,
  timer: null,
  source: 'js',             // 'js' | 'rust'
  rust: { available: false, buffer: [], pos: 0, waiting: false },
};

// ---------------------------------------------------------------- clocks
function parseTC(v){
  const [b, i] = v.split('+').map(Number);
  return { base: b * 1000, inc: i * 1000 };
}
function fmtTime(ms){
  if (ms < 0) ms = 0;
  const t = Math.ceil(ms / 1000);
  const m = Math.floor(t / 60);
  const s = t % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function startClock(){
  stopClock();
  state.lastTick = performance.now();
  // Which clock runs is derived from the position on every tick, never captured
  // once. Capturing the side at call time means any path that swaps the side to
  // move without restarting the interval leaves the wrong clock counting, and
  // because the increment is then applied to the other one, a display that
  // appears to run backwards is the symptom.
  state.timer = setInterval(() => {
    const now = performance.now();
    // Cap the decrement: a backgrounded tab that wakes up after minutes must not
    // dump all of that into one tick.
    const dt = Math.min(now - state.lastTick, 500);
    state.lastTick = now;

    const side = state.pos.turn;               // live, not captured
    const key = side > 0 ? 'w' : 'b';
    state.clocks[key] -= dt;

    if (state.clocks[key] <= 0){
      state.clocks[key] = 0;
      stopClock();
      setStatus(`<b>${side > 0 ? 'White' : 'Black'}</b> flagged on time.`);
      state.over = true;
    }
    renderClocks();
  }, 100);
}
function stopClock(){
  if (state.timer){ clearInterval(state.timer); state.timer = null; }
}
/**
 * Show "+N" on the clock that just banked its increment.
 *
 * A clock that counts up is the single most confusing thing in a game with an
 * increment, and it is exactly what made this look like a broken timer. The
 * number now jumps and something visibly explains why.
 */
function flashIncrement(key){
  const el = $(key === 'w' ? 'cw' : 'cb');
  const inc = state.clocks.inc;
  if (!el || !inc) return;
  let flash = el.querySelector('.inc');
  if (!flash) {
    flash = document.createElement('span');
    flash.className = 'inc';
    el.appendChild(flash);
  }
  flash.textContent = '+' + Math.round(inc / 1000);
  flash.classList.remove('show');
  void flash.offsetWidth;                 // force a reflow so it re-animates
  flash.classList.add('show');
  clearTimeout(flash._timer);
  flash._timer = setTimeout(() => flash.classList.remove('show'), 1400);
}

function renderClocks(){
  $('cwt').textContent = fmtTime(state.clocks.w);
  $('cbt').textContent = fmtTime(state.clocks.b);
  $('cw').classList.toggle('active', state.pos.turn > 0 && !state.over);
  $('cb').classList.toggle('active', state.pos.turn < 0 && !state.over);
  $('cw').classList.toggle('low', state.clocks.w < 30000);
  $('cb').classList.toggle('low', state.clocks.b < 30000);
}

// ---------------------------------------------------------------- arrows
// One SVG layer sits over the board. Arrows are drawn in board coordinates so
// they stay correct at any window size.
function renderArrows(list) {
  const board = $('board');
  let layer = $('arrows');
  if (!layer) {
    layer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    layer.id = 'arrows';
    $('board').parentElement.appendChild(layer);
  }
  const r = board.getBoundingClientRect();
  const w = r.width, h = r.height;
  layer.setAttribute('viewBox', `0 0 ${w} ${h}`);
  layer.setAttribute('width', w);
  layer.setAttribute('height', h);
  layer.style.left = board.offsetLeft + 'px';
  layer.style.top = board.offsetTop + 'px';

  // Derive the cell centre from sqIndex(), the same function that positions the
  // squares in renderBoard(). Recomputing the flip maths here instead would be a
  // silent bug the first time the board orientation logic changes.
  const centre = (sq) => {
    const idx = sqIndex(sq);
    const cell = w / 8;
    return [((idx % 8) + 0.5) * cell, (Math.floor(idx / 8) + 0.5) * cell];
  };

  let svg = '';
  (list || []).forEach((a, i) => {
    const [x1, y1] = centre(a.from);
    const [x2, y2] = centre(a.to);
    const id = 'ah' + i;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const inset = Math.min(len * 0.32, w * 0.05);
    const sx = x1 + ux * inset, sy = y1 + uy * inset;
    const ex = x2 - ux * inset, ey = y2 - uy * inset;
    const bow = Math.min(len * 0.1, w * 0.03);
    const mx = (sx + ex) / 2 - uy * bow;
    const my = (sy + ey) / 2 + ux * bow;
    // markerUnits must be userSpaceOnUse. The SVG default is "strokeWidth",
    // which multiplies the marker size by the stroke width - a markerWidth of 7
    // against a 15px stroke produced arrowheads over 100px across that covered
    // three squares. Size the head as a fraction of the cell instead.
    // 0.045 of the board is about 22px on a 480px board - a third of a square.
    // That sits between the original 100px monsters and the 13px version that
    // was too small to see across a piece.
    const head = w * 0.045;
    svg += `<defs><marker id="${id}" markerUnits="userSpaceOnUse"
            markerWidth="${head.toFixed(1)}" markerHeight="${head.toFixed(1)}"
            viewBox="0 0 10 10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="${a.color}"/></marker></defs>`;
    svg += `<path d="M${sx.toFixed(1)},${sy.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}"
            fill="none" stroke="${a.color}" stroke-width="${(w * 0.024).toFixed(1)}"
            opacity="0.88" marker-end="url(#${id})" stroke-linecap="round"/>`;
  });
  layer.innerHTML = svg;
}
window.addEventListener('resize', () => renderArrows(state.arrows || []));

// ---------------------------------------------------------------- coach
// Grade a move by comparing the evaluation before it with the evaluation after
// the opponent's best reply. That gap is the only honest measure of how good
// the move was: a move that looks fine but lets a forcing reply is worth less
// than it appears.
function fmtPawns(cp) {
  const v = cp / 100;
  return (v >= 0 ? '+' : '') + v.toFixed(2);
}

/** The colour a move of this quality gets on the board and in the list. */
function setCoach(html) {
  const body = $('coachBody');
  if (body) body.innerHTML = html || '';
}

/** Put the badge, the swing and the running accuracy in the top strip. */
function setCoachHeader(band, swingHtml, accuracyHtml) {
  const badge = $('coachBadgeTop');
  const swing = $('coachSwing');
  const acc = $('coachAccuracy');
  if (badge && band) {
    badge.className = 'ct-badge ' + band.cls;
    badge.textContent = band.label;
  }
  if (swing) swing.innerHTML = swingHtml || '&nbsp;';
  if (acc) acc.innerHTML = accuracyHtml || '';
}

function setCoachIdle() {
  const badge = $('coachBadgeTop');
  if (badge) { badge.className = 'ct-badge b-ok'; badge.textContent = 'no move yet'; }
  setCoachHeader(null, '&nbsp;', 'accuracy &mdash;');
}

/**
 * Running game accuracy, the way lichess reports it: the mean of the per-move
 * accuracy over the moves the player actually chose. Moves the coach never
 * analysed are skipped rather than counted as perfect.
 */
function gameAccuracy() {
  const mine = state.history.filter((h) => h.grade && h.grade.accuracy !== undefined);
  if (!mine.length) return null;
  return mine.reduce((a, h) => a + h.grade.accuracy, 0) / mine.length;
}

/**
 * Analyse an arbitrary position given as a FEN.
 *
 * Takes a FEN rather than a Position because the coach needs to score the
 * position *before* the move, which is no longer the live board. Returns
 * { move, score, san } where score is always from the side-to-move's point of
 * view, matching both think() and UCI.
 */
async function searchPosition(fen, budgetMs) {
  const pos = new Position(fen);
  // The coach always plays at full strength regardless of the difficulty
  // slider, or it could not find the punish it is supposed to be explaining.
  const skill = 20;
  if (state.source === 'rust' && state.rust.available) {
    const r = await askRust(skill, budgetMs, fen, true);
    return { move: r.move, score: r.score, san: r.san };
  }
  // Depth, not time, for the JavaScript engine - there is no way to interrupt a
  // synchronous think(). Measured here: depth 4 ~0.46s, depth 5 ~9s, depth 6
  // ~35s. Depth 4 is the furthest this machine can go and still feel instant,
  // so it is the ceiling no matter how much time was asked for.
  const d = budgetMs >= 400 ? 4 : budgetMs >= 150 ? 3 : 2;
  // Yield first, or the synchronous search below blocks the paint that shows
  // "analysing..." and the board looks frozen before anything has happened.
  await new Promise((r) => setTimeout(r, 0));
  const res = think(pos, d);
  return { move: res.move, score: res.score, san: res.move ? safeSan(pos, res.move) : null };
}

/**
 * Grade the move the human just played.
 *
 * The score gap that matters is the difference between how good the position
 * looked before the move and how good it is once the opponent has answered
 * optimally. Scoring the position immediately after the human's move would
 * flatter every move, because a blunder usually only becomes visible when the
 * opponent finds the follow-up.
 */
async function runCoach(played, fenBefore, fenAfter) {
  const budget = coachBudgetMs();
  // Snapshot the move count now, once the engine's reply is on the board. Any
  // further change means the player has moved on and this analysis is stale.
  const lenAtStart = state.history.length;
  setCoach('<span style="color:#6d6151">analysing your move...</span>');
  const pendingBadge = $('coachBadgeTop');
  if (pendingBadge) { pendingBadge.className = 'ct-badge b-ok'; pendingBadge.textContent = 'thinking...'; }

  // Short search before the move (enough to score it), full budget after, since
  // finding the opponent's best reply is the whole point.
  // Same budget for both. Scoring the starting position more shallowly than the
  // ending one would quietly understate every loss, which is the one number the
  // coach is judged on.
  const pre  = await searchPosition(fenBefore, budget);
  const post = await searchPosition(fenAfter, budget);

  // The player may have moved on while we were thinking.
  if (state.history.length !== lenAtStart) return;

  const beforeHuman = pre.score;     // fenBefore: the human is to move
  const afterHuman = -post.score;    // fenAfter: the opponent is to move
  const loss = beforeHuman - afterHuman;

  const winBefore = winPercent(beforeHuman);
  const winAfter = winPercent(afterHuman);
  const winLost = Math.max(0, winBefore - winAfter);   // percentage points
  const band = gradeMove(winLost);
  const accuracy = moveAccuracy(winBefore, winAfter);
  const oppName = played.mover > 0 ? 'Black' : 'White';

  // Three arrows, because "what should I have played?" is the whole question:
  //   the move you made              - coloured by how good it was
  //   the move you should have played - blue, from the position BEFORE the move
  //   your opponent's best reply      - dark red, from the position AFTER
  // The first two come from the same position, so they are directly comparable;
  // only the reply belongs to the next ply.
  const arrows = [{
    from: played.from, to: played.to,
    color: bandColor(band.key),
  }];
  let betterText = '';
  const sameMove = pre.move && pre.move.from === played.from && pre.move.to === played.to;
  if (pre.move && !sameMove) {
    arrows.push({ from: pre.move.from, to: pre.move.to, color: '#4a9fe0' });
    betterText = ` You played <b>${played.san}</b>; the engine's first choice was <b>${pre.san}</b>.`;
  } else if (sameMove) {
    betterText = ` <b>${played.san}</b> was the engine's first choice.`;
  }

  let replyText = '';
  if (post.move) {
    arrows.push({ from: post.move.from, to: post.move.to, color: '#c0392b' });
    replyText = ` ${oppName} answers with <b>${post.san}</b>.`;
  }
  state.arrows = arrows;
  renderArrows(arrows);

  const teach = coachAdvice(band, loss);
  const swing = `${fmtPawns(beforeHuman)} &rarr; ${fmtPawns(afterHuman)}` +
                ` &nbsp;<span style="opacity:.75">${
                  winLost < 0.05 ? 'no change' : `&minus;${winLost.toFixed(1)}% win chance`
                }</span>`;

  setCoachHeader(band, swing, `${accuracy.toFixed(1)}% accuracy on this move`);
  setCoach(`${betterText}${replyText}<div class="ct-teach">${teach}</div>`);
  state.lastCoach = { loss, winLost, band, accuracy, played, bestReply: post.move };

  // Remember the verdict on the move itself so the list can show it later and a
  // click on the move can bring the explanation back. That is the player's move,
  // not the engine's reply that was appended after it.
  const playedEntry = state.history.find((h) => h.from === played.from && h.to === played.to);
  if (playedEntry) {
    playedEntry.grade = {
      key: band.key,
      cls: band.cls,
      short: band.short,
      accuracy,
      detail: $('coachBody').innerHTML,
      arrows: arrows.slice(),
    };
    renderMoves();
  }

  // Show the per-move figure and the running average together. Replacing one
  // with the other loses whichever the reader wanted.
  const overall = gameAccuracy();
  const acc = $('coachAccuracy');
  if (acc) {
    acc.innerHTML = overall === null
      ? `${accuracy.toFixed(1)}% accuracy on this move`
      : `${accuracy.toFixed(1)}% on this move &middot; game ${overall.toFixed(1)}% over ${playedCount()}`;
  }
}

/** How many of the player's moves the coach has graded. */
function playedCount() {
  return state.history.filter((h) => h.grade).length;
}

function safeSan(pos, m) {
  try { return toSan(pos, m); } catch (e) { return sqName(m.from) + sqName(m.to); }
}

/** Format a score that was lost, always shown as a negative number. */
function fmtLoss(cp) {
  return '-' + Math.abs(cp / 100).toFixed(2);
}

function coachBudgetMs() {
  return parseInt($('coachDepth').value, 10) || 600;
}

// ---------------------------------------------------------------- board
function renderBoard(){
  const b = $('board');
  b.innerHTML = '';
  const order = [];
  // Normal view: rank 8 on top, files a-h left to right.
  // Flipped: rank 1 on top and files h-a, i.e. a 180 degree rotation so the
  // side you are playing sits at the bottom. Mirroring only the files (the old
  // behaviour) produced a board that was not a rotation at all - rank 8 stayed
  // on top, so Black's pieces still read as being at the far end.
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    order.push(state.flipped ? [7 - f, r] : [f, 7 - r]);
  }
  for (const [file, rank] of order){
    const sq = makeSq(file, rank);
    const div = document.createElement('div');
    div.className = 'sq ' + (((file + rank) % 2 === 1) ? 'light' : 'dark');
    div.dataset.sq = sq;

    const pc = state.pos.board[sq];
    if (pc !== EMPTY){
      const el = document.createElement('span');
      el.className = 'pc ' + (pc > 0 ? 'w' : 'b');
      el.textContent = GLYPH[pc];
      div.appendChild(el);
    }

    if (state.selected !== null && state.legal.some(m => m.from === state.selected && m.to === sq)){
      const target = state.pos.board[sq];
      const marker = document.createElement('div');
      marker.className = (target !== EMPTY || state.selected === sq) ? 'cap' : 'dot';
      if (target !== EMPTY) marker.className = 'cap';
      div.appendChild(marker);
    }
    if (state.selected === sq) div.classList.add('sel');
    if (state.lastMove && (sq === state.lastMove.from || sq === state.lastMove.to)) div.classList.add('last');

    div.addEventListener('click', () => onSquareClick(sq));
    b.appendChild(div);
  }

  // check highlight: the king of the side to move gets a red square
  if (inCheck(state.pos, state.pos.turn)){
    const ksq = state.pos.kingSq(state.pos.turn);
    const el = b.children[sqIndex(ksq)];
    if (el) el.classList.add('check');
  }
  // Read the file and rank back out of the mapping instead of assuming
  // col == file and rank == 8 - row. That assumption is only true in one
  // orientation, which is how the labels ended up wrong when the board flipped.
  Array.from(b.children).forEach((el, i) => {
    const { file, rank } = sqAtIndex(i);
    if (Math.floor(i / 8) === 7){
      const c = document.createElement('span');
      c.className = 'coord f';
      c.textContent = 'abcdefgh'[file];
      el.appendChild(c);
    }
    if (file === 7){
      const c = document.createElement('span');
      c.className = 'coord r';
      c.textContent = String(rank + 1);
      el.appendChild(c);
    }
  });
}
/**
 * Where a square sits among the board's 64 DOM children.
 * Keep in step with renderBoard()'s order array and with sqAtIndex() below.
 */
function sqIndex(sq){
  const f = fileOf(sq), r = rankOf(sq);
  return state.flipped ? (7 - f) + r * 8 : f + (7 - r) * 8;
}

/** Inverse of sqIndex(): which square is in DOM child `i`. */
function sqAtIndex(i){
  const col = i % 8, row = Math.floor(i / 8);
  return state.flipped
    ? { file: 7 - col, rank: row }
    : { file: col,     rank: 7 - row };
}
// ---------------------------------------------------------------- moves
function onSquareClick(sq){
  if (state.over || state.thinking) return;
  if ($('modeSel').value === 'engine' && state.pos.turn !== humanSide()) return;

  if (state.selected !== null){
    const match = state.legal.find(m => m.from === state.selected && m.to === sq);
    if (match){
      if (needsPromotion(match)){
        pendingPromotion = match;
        $('promoDlg').showModal();
        return;
      }
      commitMove(match);
      return;
    }
  }
  state.selected = (state.selected === sq) ? null : sq;
  state.legal = state.selected === null ? [] : legalMovesFrom(state.pos, sq);
  if (state.selected !== null && state.legal.length === 0) state.selected = null;
  renderBoard();
}

let pendingPromotion = null;
$('promoDlg').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = Number(btn.dataset.p);
    $('promoDlg').close();
    if (pendingPromotion){
      const m = { ...pendingPromotion, promo: p };
      pendingPromotion = null;
      commitMove(m);
    }
  });
});

function needsPromotion(m){
  return m.promo === 0 &&
    Math.abs(state.pos.board[m.from]) === 1 &&
    rankOf(m.to) === (state.pos.turn > 0 ? 7 : 0);
}

function humanSide(){
  if ($('modeSel').value === 'human') return null;
  return $('sideSel').value === 'white' ? 1 : -1;
}

function commitMove(m){
  const san = toSan(state.pos, m);
  const before = state.pos.fen();
  const next = applyMove(state.pos, m);
  const mover = state.pos.turn;
  const grade = null;
  state.history.push({ san, from: m.from, to: m.to, fenBefore: before, mover, grade });
  state.pos = next;
  state.lastMove = { from: m.from, to: m.to };
  state.selected = null;
  state.legal = [];

  // Clock: the mover banks the increment. state.pos.turn has already flipped,
  // so the mover is the side that is now NOT to move.
  const key = state.pos.turn > 0 ? 'b' : 'w';
  state.clocks[key] += state.clocks.inc;
  flashIncrement(key);

  renderAll();

  const st = gameStatus(state.pos);
  if (st.over){
    state.over = true;
    stopClock();
    setStatus(`<b>${st.reason}</b> &mdash; result ${st.result}`);
    return;
  }

  const hs = humanSide();
  if (hs === null) {
    startClock();
  } else if (state.pos.turn === hs) {
    // The engine has replied. Only clear the arrows when the coach is not going
    // to replace them - clearing here wiped the arrow for the move the player
    // had just made, leaving an empty board whenever the coach was slow.
    startClock();
    if (!coachEnabled()) {
      state.arrows = [];
      renderArrows([]);
    }
  } else {
    // The engine is now to move, so its clock runs while it thinks. That is
    // what a real chess clock does, and it is why the number used to appear to
    // jump upwards: it was frozen and then banked the increment.
    startClock();

    // Coach: grade the move the human just made.
    //
    // This runs AFTER the engine has replied. Both drive the same UCI pipe, so
    // analysing concurrently with engineMove() interleaves their output and
    // corrupts both. The FENs are captured now because state.pos moves on.
    const played = { from: m.from, to: m.to, mover, san };
    const fenBefore = before;
    const fenAfter = state.pos.fen();
    state.arrows = [{ from: m.from, to: m.to, color: '#e6c14a' }];
    renderArrows(state.arrows);

    // Show something straight away. The panel used to stay hidden until the
    // analysis finished, which on a slow search read as "there is no rating at
    // all" rather than "still thinking".
    if (coachEnabled()) setCoach('<span style="color:#6d6151">analysing your move...</span>');

    engineMove().then(() => {
      if (!coachEnabled()) return;
      return runCoach(played, fenBefore, fenAfter).catch((e) => {
        // An empty catch left the panel stuck on "analysing..." with no
        // explanation, which is indistinguishable from a hang.
        setCoach(`<span style="color:#c98">coach failed: ${e && e.message}</span>`);
      });
    });
  }
}

function coachEnabled() {
  const el = $('coachOn');
  return el ? el.checked : false;
}

// ---------------------------------------------------------------- engine
async function engineMove(){
  state.thinking = true;
  renderBoard();

  const skill = Number($('levelSel').value);
  // Same budget formula as the engine's own Eq (16): a fraction of the clock
  // plus most of the increment, so the engine uses its time instead of a
  // fixed depth it could overrun.
  const key = state.pos.turn > 0 ? 'w' : 'b';
  const remaining = state.clocks[key];
  // Capped hard. The old formula allowed ~7.6s per move on a 3+2 clock, which
  // combined with the coach's own two searches was long enough that the board
  // looked dead.
  const budget = Math.max(120, Math.min(1200,
    Math.min(remaining / 5, remaining / 30 + state.clocks.inc * 0.8)));

  let best = null, score = 0;
  if (state.source === 'rust' && state.rust.available){
    const r = await askRust(skill, budget);
    best = r.move; score = r.score;
  } else {
    setStatus('engine thinking...');
    await new Promise(r => setTimeout(r, 10));
    // The JavaScript fallback uses depth: a weak opponent is a shallow search.
    // Same ceiling as the coach: depth 5 is ~9s on this machine.
    const depth = Math.max(1, Math.min(4, Math.round(skill / 4)));
    const res = think(state.pos, depth, (info) => {
      setStatus(`engine thinking... depth ${info.depth}`);
    });
    best = res.move; score = res.score;
  }

  updateEval(score);
  state.thinking = false;

  if (!best){
    setStatus('<b>no legal move</b>');
    return;
  }
  commitMove(best);
}

function updateEval(score){
  if (score === undefined || score === null){ return; }
  // convert a side-to-move score into White's score
  const white = state.pos.turn > 0 ? score : -score;
  const pct = 1 / (1 + Math.pow(10, -white / 400));
  $('evalFill').style.height = (pct * 100).toFixed(1) + '%';
  $('evalLabel').textContent = (white / 100).toFixed(2);
}

// ---------------------------------------------------------------- engine link
// Two ways to reach the engine:
//   - inside the Tauri desktop app: direct IPC, no Node and no port involved
//   - in a browser talking to `node server.js`: plain HTTP
// Both speak the same UCI text; only the transport differs.
const IN_TAURI = typeof window.__TAURI_INTERNALS__ !== 'undefined'
              || typeof window.__TAURI__ !== 'undefined';

async function tauriInvoke(cmd, args) {
  if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
    return window.__TAURI__.core.invoke(cmd, args);
  }
  if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
    return window.__TAURI_INTERNALS__.invoke(cmd, args);
  }
  throw new Error('tauri ipc unavailable');
}

async function httpPost(url, body) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await r.json();
  } catch (e) { return null; }
}

async function httpGet(url) {
  try {
    const r = await fetch(url);
    const j = await r.json();
    if (typeof j.pos === 'number') state.rust.pos = j.pos;
    return j.lines || [];
  } catch (e) { return []; }
}

// ---------------------------------------------------------------- rust bridge
// Every engine command goes through this queue. Two overlapping "go" commands on
// one UCI pipe interleave their output, which silently corrupts both results -
// so the coach's analysis and the engine's own move are strictly serialised.
let uciQueue = Promise.resolve();
function withEngine(fn) {
  const run = uciQueue.then(fn, fn);
  uciQueue = run.then(() => {}, () => {});
  return run;
}

async function askRust(skill, budgetMs, fen, quiet) {
  return withEngine(() => askRustInner(skill, budgetMs, fen, quiet));
}

async function askRustInner(skill, budgetMs, fen, quiet){
  if (!state.rust.available) return { move: null, score: 0, san: null };
  // fen lets the coach analyse a position that is no longer on the board. When
  // omitted it searches the live position, which is what the opponent needs.
  const searchFen = fen || state.pos.fen();
  // Skill Level is the honest weakness dial. Depth is not: at a fixed depth the
  // engine misses deep tactics but will still pick a depth-1 "brilliant" move
  // over its own depth-1 refutation. A narrower window makes it miss the good
  // moves on purpose, which is what a weak opponent should do.
  const cmds = [
    `ucinewgame`,
    `setoption name Skill Level value ${skill}`,
    `position fen ${searchFen}`,
    `go movetime ${Math.max(100, Math.round(budgetMs))}`,
  ];
  if (IN_TAURI) await tauriInvoke('uci_send', { lines: cmds });
  else await httpPost('/uci', { lines: cmds });

  // The score has to be latched from the info lines: `bestmove` carries no
  // score, and returning 0 here made the coach grade every move as worthless.
  let lastScore = 0;

  // read until bestmove
  for (let i = 0; i < 4000; i++){
    let lines;
    if (IN_TAURI) {
      const r = await tauriInvoke('uci_read', {});
      lines = (r && r.lines) ? r.lines : [];
    } else {
      lines = await httpGet(`/out?since=${state.rust.pos}`);
    }
    if (lines.length){
      for (const ln of lines){
        log(ln);
        if (ln.startsWith('info depth')){
          const m = ln.match(/score (cp|mate) (-?\d+)/);
          if (m) {
            lastScore = Number(m[2]);
            // quiet = an analysis pass that must not move the eval bar
            if (!quiet) updateEval(lastScore);
          }
        }
        if (ln.startsWith('bestmove')){
          const from = sqFromName(ln.slice(9, 11));
          const to = sqFromName(ln.slice(11, 13));
          const promoChar = ln[13];
          const promo = promoChar ? ({ n:2, b:3, r:4, q:5 })[promoChar] || 0 : 0;
          const probe = new Position(searchFen);
          const legal = generateLegal(probe);
          const match = legal.find(x => x.from === from && x.to === to && (promo === 0 || x.promo === promo))
                     || legal.find(x => x.from === from && x.to === to)
                     || legal[0];
          return {
            move: match,
            score: lastScore,
            san: match ? safeSan(probe, match) : null,
          };
        }
      }
    } else {
      await new Promise(r => setTimeout(r, 20));
    }
  }
  return { move: null, score: lastScore, san: null };
}

function log(s){
  const el = $('log');
  el.textContent += (el.textContent ? '\n' : '') + s;
  el.scrollTop = el.scrollHeight;
}

async function probeRust(){
  let info = null;
  if (IN_TAURI) {
    info = await tauriInvoke('engine_info', {}).catch(() => null);
  } else {
    info = await fetch('/engine').then(r => r.json()).catch(() => null);
  }
  if (info && info.ready){
    state.rust.available = true;
    state.source = 'rust';
    $('srcBadge').textContent = 'aurora-engine (Rust)';
    $('srcBadge').classList.add('on');
  } else {
    state.source = 'js';
    $('srcBadge').textContent = 'built-in JavaScript engine';
  }
  const label = $('srcLabel');
  if (label) {
    label.textContent = IN_TAURI
      ? 'transport: Tauri IPC'
      : (info && info.ready ? 'transport: HTTP bridge' : 'no bridge detected');
  }
}

// ---------------------------------------------------------------- render
function renderAll(){
  renderBoard();
  renderClocks();
  renderMoves();
}

function renderMoves(){
  const el = $('moves');
  if (state.history.length === 0){ el.innerHTML = '<span style="color:#6d6151">no moves yet</span>'; return; }
  let html = '';
  state.history.forEach((h, i) => {
    if (i % 2 === 0) html += `<span class="num">${i / 2 + 1}.</span>`;
    let tag = '';
    if (h.grade && h.grade.key) {
      tag = ` <span class="coachbadge ${h.grade.cls}" style="font-size:10px;padding:0 6px">${h.grade.short}</span>`;
    }
    html += `<span class="san${i === state.history.length - 1 ? ' last' : ''}" data-i="${i}">${h.san}</span>${tag} `;
  });
  el.innerHTML = html;
  el.querySelectorAll('.san').forEach(s => {
    s.addEventListener('click', () => {
      const i = Number(s.dataset.i);
      const h = state.history[i];
      state.history.length = i + 1;
      state.pos = new Position(h.fenBefore);
      state.lastMove = { from: h.from, to: h.to };
      state.over = false;
      renderAll();
      if (h.grade) {
        setCoach(h.grade.detail);
        const band = COACH_BANDS.find((b) => b.key === h.grade.key);
        setCoachHeader(
          band || { label: h.grade.key, cls: h.grade.cls },
          'reviewed move',
          h.grade.accuracy !== undefined ? `${h.grade.accuracy.toFixed(1)}% accuracy` : ''
        );
        state.arrows = h.grade.arrows || [{ from: h.from, to: h.to, color: '#e6c14a' }];
        renderArrows(state.arrows);
      }
    });
  });
  el.scrollTop = el.scrollHeight;
}

function setStatus(html){ $('status').innerHTML = html; }

// ---------------------------------------------------------------- controls
function newGame(){
  stopClock();
  const tc = parseTC($('tcSel').value);
  state.clocks = { w: tc.base, b: tc.base, inc: tc.inc };
  state.pos = new Position(START_FEN);
  state.history = [];
  state.selected = null; state.legal = [];
  state.lastMove = null; state.over = false; state.thinking = false;
  $('evalFill').style.height = '50%';
  $('evalLabel').textContent = '0.00';
  $('pv').innerHTML = '&nbsp;';
  state.arrows = [];
  state.lastCoach = null;
  renderArrows([]);
  setCoachIdle();
  setCoach('Play a move and it will be graded here. The better move and your opponent&rsquo;s best reply are drawn on the board.');
  // Put the colour you are playing at the bottom. Without this the board still
  // reads from White's side while you play Black, which is disorienting for a
  // beginner - Black's pawns appear to march the wrong way.
  state.flipped = humanSide() === -1;
  renderAll();
  setStatus(`New game. ${state.pos.turn > 0 ? 'White' : 'Black'} to move.`);

  const hs = humanSide();
  if (hs === -1) setTimeout(engineMove, 400);
  else startClock();
}

$('newBtn').onclick = newGame;
$('flipBtn').onclick = () => { state.flipped = !state.flipped; renderBoard(); };
$('undoBtn').onclick = () => {
  if (state.history.length === 0) return;
  const take = ($('modeSel').value === 'engine') ? 2 : 1;
  const back = Math.min(take, state.history.length);
  state.history.length -= back;
  const h = state.history[state.history.length - 1];
  state.pos = new Position(h ? h.fenBefore : START_FEN);
  state.lastMove = h ? { from: h.from, to: h.to } : null;
  state.over = false; state.thinking = false;
  stopClock();
  renderAll();
  setStatus('Move taken back.');
  const hs = humanSide();
  if (hs === null || state.pos.turn === hs) startClock(); else setTimeout(engineMove, 300);
};
$('resignBtn').onclick = () => {
  const side = humanSide() ?? state.pos.turn;
  state.over = true; stopClock();
  setStatus(`<b>resigned</b> &mdash; result ${side > 0 ? '0-1' : '1-0'}`);
};
$('tcSel').onchange = newGame;
$('modeSel').onchange = newGame;
$('sideSel').onchange = newGame;
$('levelSel').onchange = () => setStatus(`difficulty: skill level ${$('levelSel').value} of 20`);
$('srcSel').onchange = () => {
  const v = $('srcSel').value;
  if (v === 'js'){ state.source = 'js'; $('srcBadge').textContent = 'built-in JavaScript engine'; $('srcBadge').classList.remove('on'); }
  else if (v === 'rust' && state.rust.available){ state.source = 'rust'; $('srcBadge').textContent = 'aurora-engine (Rust)'; $('srcBadge').classList.add('on'); }
  else if (IN_TAURI) setStatus('<b>the Rust engine is not running</b> - check that aurora-engine.exe sits in the engine folder next to the app');
  else setStatus('<b>the Rust engine is not running</b> - start it with: node server.js');
};
$('logToggle').onclick = () => {
  const el = $('log');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
};
$('pgnBtn').onclick = () => {
  const pgn = buildPgn();
  const blob = new Blob([pgn], { type: 'application/x-chess-pgn' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'game.pgn';
  a.click();
  setStatus('PGN downloaded.');
};
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(state.pos.fen()); setStatus('FEN copied.'); }
  catch { setStatus('FEN: ' + state.pos.fen()); }
};
$('fenBtn').onclick = () => { $('fenInput').value = state.pos.fen(); $('fenDlg').showModal(); };
$('fenCancel').onclick = () => $('fenDlg').close();
$('fenLoad').onclick = () => {
  const fen = $('fenInput').value.trim();
  try {
    const p = new Position(fen);
    p.fen();
    state.pos = p;
    state.history = []; state.lastMove = null; state.over = false; state.thinking = false;
    $('fenDlg').close();
    renderAll();
    setStatus('Position loaded.');
  } catch { setStatus('<b>could not parse that FEN</b>'); }
};

function buildPgn(){
  const d = new Date();
  const iso = d.toISOString().replace(/\.\d+Z$/, 'Z');
  const st = gameStatus(state.pos);
  let result = '*';
  if (st.over) result = st.result;
  else if (state.over) result = '1-0';
  const moves = [];
  state.history.forEach((h, i) => {
    if (i % 2 === 0) moves.push(`${i / 2 + 1}.`);
    moves.push(h.san);
  });
  if (moves.length) moves.push(result);
  return [
    '[Event "Aurora Chess"]',
    '[Site "local"]',
    `[Date "${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}"]`,
    '[Round "-"]',
    '[White "You"]',
    '[Black "Aurora"]',
    `[Result "${result}"]`,
    '',
    moves.join(' '),
    '',
  ].join('\n');
}

// drag and drop
let dragging = null;
document.addEventListener('dragstart', () => {});
$('board').addEventListener('mousedown', (e) => {
  const sq = Number(e.target.closest('.sq')?.dataset.sq);
  if (!Number.isNaN(sq) && state.pos.board[sq] !== EMPTY && !state.over && !state.thinking){
    const hs = humanSide();
    if ($('modeSel').value === 'human' || state.pos.turn === hs){
      dragging = sq;
      onSquareClick(sq);
    }
  }
});
$('board').addEventListener('mouseup', (e) => {
  if (dragging === null) return;
  const target = e.target.closest('.sq');
  const sq = target ? Number(target.dataset.sq) : null;
  if (sq !== null && sq !== dragging) onSquareClick(sq);
  dragging = null;
});

// keyboard: n new game, f flip, u undo
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'n') newGame();
  if (e.key === 'f') { state.flipped = !state.flipped; renderBoard(); }
  if (e.key === 'u') $('undoBtn').click();
});

// ---------------------------------------------------------------- boot
probeRust().finally(() => newGame());
setStatus('Loading rules...');
</script>
</body>
</html>
